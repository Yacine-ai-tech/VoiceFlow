<!doctype html>
<html lang="en" data-theme="voiceflow">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <meta name="description" content="VoiceFlow — spoken conversations become structured business intelligence" />
    <title>VoiceFlow — AI Speech Intelligence</title>
  
    <!-- Low-Bandwidth / Sahel Optimizations -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, shrink-to-fit=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://gateway.ysiddo-ai-projects.app" crossorigin />
    <link rel="dns-prefetch" href="https://gateway.ysiddo-ai-projects.app" />
    <!-- Anonymous usage analytics respects browser DNT and Global Privacy Control signals. -->
    <script defer src="https://gateway.ysiddo-ai-projects.app/track.js" data-service="VoiceFlow" data-source="demo"></script>
    <script>
      (function() {
        if (window.location.hostname.endsWith('.vercel.app')) {
          window.location.replace('https://voiceflow.ysiddo-ai-projects.app' + window.location.pathname + window.location.search + window.location.hash);
        }
      })();
    </script>
    <script>
      // Zero-Trust Fresh Code Guarantee: Unregister SW & clear CacheStorage on every mount
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var registration of registrations) {
            registration.unregister();
          }
        }).catch(function() {});
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) {
            caches.delete(name);
          }
        }).catch(function() {});
      }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  
    

</body>
</html>
