# Render Blueprint — disaster-recovery / one-click redeploy. Builds from ./Dockerfile (honors $PORT),
# health-checks /health. No secrets here: every key is `sync: false` (set values in the dashboard).
# Runs on Render free: local WhisperX is lazy-loaded; for cloud transcription set a provider key
# (GROQ/DEEPGRAM/ASSEMBLYAI) and TRANSCRIPTION_PROVIDER so no heavy model loads on a 512MB host.
services:
  - type: web
    name: voiceflow
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GROQ_API_KEY          # meeting/general analysis + Groq Whisper transcription
        sync: false
      - key: ANTHROPIC_API_KEY     # sales/support/interview analysis (Claude)
        sync: false
      - key: TRANSCRIPTION_PROVIDER # e.g. groq — avoids loading local WhisperX on free tier
        sync: false
      - key: DEEPGRAM_API_KEY      # optional transcription provider
        sync: false
      - key: ASSEMBLYAI_API_KEY    # optional transcription provider
        sync: false
      - key: VOICEFLOW_REMOTE_ENDPOINT  # optional: delegate heavy local ASR/diarization to a
        sync: false                     # host you control, instead of loading it on this 512MB one
      - key: VOICEFLOW_REMOTE_TOKEN
        sync: false
      - key: VOICEFLOW_TTS_REMOTE_ENDPOINT  # optional: same idea for provider=kokoro TTS
        sync: false
      - key: VOICEFLOW_TTS_REMOTE_TOKEN
        sync: false
      - key: REALTIME_PROVIDER     # "openai" or "gemini" — which one WS /realtime uses, no fallback
        value: openai
      - key: OPENAI_API_KEY        # required for /realtime when REALTIME_PROVIDER=openai
        sync: false
      - key: GEMINI_API_KEY        # required for /realtime when REALTIME_PROVIDER=gemini
        sync: false
      - key: ELEVENLABS_API_KEY    # optional: premium TTS provider for /tts
        sync: false
      - key: AGENT_TOOLS_URL       # optional: any service implementing the agent-tools discovery
        sync: false                # contract (services/agent_tools_bridge.py) — not tied to a specific product
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: OMNIINTEL_INTERNAL_TOKEN  # needed if REQUIRE_INTERNAL_TOKEN is true here, or to auth
        sync: false                    # against the AGENT_TOOLS_URL service if it requires this token too
      - key: REQUIRE_INTERNAL_TOKEN
        value: "false"
      - key: TELEMETRY_ENDPOINT    # optional: anonymous startup ping target, see TELEMETRY.md
        sync: false
      - key: TELEMETRY_OPT_OUT
        value: "false"
