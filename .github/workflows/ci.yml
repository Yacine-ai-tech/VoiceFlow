name: VoiceFlow CI & Deploy

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]
  schedule:
    - cron: "0 3 * * *"   # Nightly smoke test at 03:00 UTC
  workflow_dispatch:        # Allow manual trigger

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION:   "20"
  VOICEFLOW_URL:   ${{ secrets.VOICEFLOW_URL  || '' }}
  VOICEFLOW_INTERNAL_TOKEN: ${{ secrets.VOICEFLOW_INTERNAL_TOKEN  }}
  TELEMETRY_OPT_OUT: "false"

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 1 — Test: Run Python tests and linting
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    name: "Python Tests & Linting"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short
      
      - name: Check code style
        run: |
          pip install flake8
          flake8 api.py pipeline/ core/ --max-line-length=100 --ignore=E501

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 2 — Frontend Tests
  # ═══════════════════════════════════════════════════════════════════════════
  frontend-test:
    name: "Frontend Tests"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm ci
      
      - name: Run frontend tests
        working-directory: ./frontend
        run: |
          npm test -- --passWithNoTests

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 3 — E2E Smoke Tests (against deployed service)
  # ═══════════════════════════════════════════════════════════════════════════
  e2e-smoke:
    name: "E2E Smoke Tests"
    runs-on: ubuntu-latest
    needs: [test, frontend-test]
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx
      
      - name: Health check
        run: |
          python -c "
          import httpx
          response = httpx.get('${{ env.VOICEFLOW_URL }}/health', timeout=10)
          print(f'Health check: {response.status_code}')
          assert response.status_code == 200
          print(f'Response: {response.json()}')
          "
      
      - name: Endpoint availability test
        run: |
          python -c "
          import httpx
          headers = {'X-VoiceFlow-Internal-Token': '${{ env.VOICEFLOW_INTERNAL_TOKEN }}'}
          
          # Test health endpoint
          response = httpx.get('${{ env.VOICEFLOW_URL }}/health', timeout=10)
          print(f'Health: {response.status_code}')
          
          # Test transcribe endpoint
          response = httpx.post('${{ env.VOICEFLOW_URL }}/transcribe', timeout=10)
          print(f'Transcribe: {response.status_code}')
          
          print('All endpoints accessible')
          "

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 4 — Deploy: Trigger Render deploy
  # ═══════════════════════════════════════════════════════════════════════════
  deploy:
    name: "Trigger Render Deploy"
    runs-on: ubuntu-latest
    needs: [e2e-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Trigger Render Deploy
        run: |
          echo "Render deploy would be triggered here"
          echo "Configure render.yaml to auto-deploy on push to main"
